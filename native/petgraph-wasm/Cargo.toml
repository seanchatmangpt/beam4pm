# petgraph-wasm: a real graph-algorithms engine (Dijkstra shortest path,
# Tarjan SCC, topological sort, cycle detection) over the DFGs and Petri
# nets rust4pm-wasm already produces, compiled to wasm32-wasip1 and hosted
# inside BEAM via wasmex. Hand-authored manufacturing input (like
# native/rust4pm-wasm and native/ferroplan is a submodule of), not ggen
# pack-template output.
[package]
name = "petgraph-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# petgraph is pure Rust, no C dependencies -- compiles to wasm32-wasip1
# without any feature gymnastics, unlike polars (parquet compression deps
# don't cross-compile) or anything requiring a C toolchain.
petgraph = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
