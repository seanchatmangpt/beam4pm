# rust4pm-wasm: the ONE process-mining engine for beam4pm, compiled to
# wasm32-wasip1 and hosted inside BEAM via wasmex. Hand-authored
# manufacturing input (like native/rf1-dfg-oracle and
# native/rf2-conformance-oracle), not ggen pack-template output.
[package]
name = "rust4pm-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the exact rust4pm version the rf1/rf2 native oracles use, so the
# wasm engine and the differential-anchor oracles run literally the same
# algorithm code. default-features = false because several default features
# would not compile for wasm32-wasip1.
process_mining = { version = "=0.6.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON strings cannot carry raw gzip bytes; the import_xes_gz op ships
# .xes.gz content as base64 (pure-Rust codec, wasm-clean).
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
