# rust4pm-wasm: the ONE process-mining engine for beam4pm, compiled to
# wasm32-wasip1 and hosted inside BEAM via wasmex. Hand-authored
# manufacturing input (like native/rf1-dfg-oracle and
# native/rf2-conformance-oracle), not ggen pack-template output.
[package]
name = "rust4pm-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the exact rust4pm-powl fork commit the rf1/rf2 native oracles and
# qualification/rust4pm-oracle use, so the wasm engine and the
# differential-anchor oracles run literally the same algorithm code. This is
# seanchatmangpt/rust4pm (a fork of aarkue/rust4pm@0.6.2) with a POWL
# (Partially Ordered Workflow Language) discovery module added --
# process_mining upstream has strong OCEL 2.0 support but no POWL. See
# docs/jira/v26.8.29/14-rust4pm-reference-boundary.md for the doctrine change
# this represents (rust4pm moved from reference-only to a forked,
# hand-authored dependency for POWL specifically).
# default-features = false because several default features would not
# compile for wasm32-wasip1.
process_mining = { git = "https://github.com/seanchatmangpt/rust4pm.git", rev = "89a6a30", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# timestamp parsing for ocel_add_event (same chrono the crate itself uses)
chrono = { version = "0.4", default-features = false, features = ["std"] }
# JSON strings cannot carry raw gzip bytes; the import_xes_gz op ships
# .xes.gz content as base64 (pure-Rust codec, wasm-clean).
base64 = "0.22"
# Same quick-xml line process_mining 0.6.2 itself resolves (0.37.x) -- used only
# to hand export_ocel_xml a recoverable Writer over an in-memory Vec<u8>.
quick-xml = "0.37"

[profile.release]
opt-level = "s"
lto = true
