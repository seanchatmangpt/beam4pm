# ggen-verify-pack: investigated 2026-09-10 (OCEL evidence-architecture
# Phase 4), NOT wired yet. Its 4 ver:RequiredCheck facts (build/test/
# clippy-reference/byte-identity) are hard-coded `cargo build --workspace` /
# `cargo test --workspace` / `cargo clippy ...` commands admitted directly
# in the pack's own ontology.ttl -- correct for a Rust-generated consumer,
# but beam4pm's manufactured projections are Erlang/Elixir/Gleam (rebar3
# eunit + mix test), so wiring the pack as-is makes every `ggen sync run`
# refuse at gate 010_evidence_present.rq (missing evidence for `build`),
# confirmed by a real `ggen sync run --dry-run` against this exact
# [packs] entry. Real wiring needs either (a) the pack adding a
# consumer-overridable RequiredCheck set (upstream pack change), or (b) a
# beam4pm-local reinterpretation of ver:req-build/-test/-clippy-reference/
# -byte-identity's ver:checkCommand to rebar3/mix equivalents without
# breaking the pack's own IRIs for its other (Rust) consumers -- neither
# attempted this session; left as a real, disclosed BLOCKED item rather
# than force cargo commands into a BEAM tree.

# gh-terraform-pack: investigated 2026-08-30, NOT wired -- ships unscoped
# reference-repo instance data that hard-collides (family "repository") or
# pollutes (families "milestones"/"labels") any second consumer's output.
# See the "gh-terraform-pack consumption -- INVESTIGATED AND DECLINED"
# comment block in ontology.ttl for the full, confirmed finding.

[templates]
dir = "templates"
