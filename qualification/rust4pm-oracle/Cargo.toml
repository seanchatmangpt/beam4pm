[package]
name = "rust4pm-oracle"
version = "0.1.0"
edition = "2021"
description = "Differential-testing oracle: beam4pm DFG discovery verified against the canonical rust4pm (process_mining) implementation"
license = "MIT"

[dependencies]
# rust4pm-powl fork (seanchatmangpt/rust4pm, forked from aarkue/rust4pm@0.6.2
# with a POWL discovery module added) -- pinned to the exact commit
# native/rust4pm-wasm/Cargo.toml uses, so this oracle and the wasm engine run
# literally the same algorithm code.
process_mining = { git = "https://github.com/seanchatmangpt/rust4pm.git", rev = "89a6a30", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
