name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ggen-manufacture:
    permissions:
      contents: read
    uses: seanchatmangpt/ggen/.github/workflows/ggen-sync-run.yml@36caa86eba04de0eae1769e71142df86fd370854
    with:
      ggen_release: v26.8.27
      ggen_asset_sha256: ab442ced90a9836fd4eb07a5d61eb58293843cd515d864699fc0d0453444a035
      working_directory: .
      dry_run: false
      artifact_retention_days: 30

  beam-chicago:
    name: Exact-head BEAM + dual-engine determinism
    needs: ggen-manufacture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject and ecosystem producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse producer or projection drift
        env:
          GGEN_CHANGED: ${{ needs.ggen-manufacture.outputs.changed }}
          GGEN_EXIT: ${{ needs.ggen-manufacture.outputs.sync_exit_code }}
        run: |
          set -euo pipefail
          test "$GGEN_EXIT" = "0"
          test "$GGEN_CHANGED" = "false"
          test "$(git -C vendor/ggen-marketplace rev-parse HEAD)" = "94d1e00ce56749742a5ffeb52979877854e45b60"
          test -f generated/elixir/lib/beam4pm_governor.ex
          test -f generated/elixir/test/beam4pm_governor_test.exs
          grep -q 'defmodule BeamPM.Governor do' generated/elixir/lib/beam4pm_governor.ex
          grep -q 'defmodule BeamPM.Autonomy.Kernel do' generated/elixir/lib/beam4pm_ash.ex

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.2"
          elixir-version: "1.17.3"
          rebar3-version: "3.24.0"

      - name: Execute Erlang Chicago suite
        run: rebar3 eunit

      - name: Re-manufacture ggen_igniter projection and execute Elixir/Ash Chicago suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/igniter_sync.sh
          rm -rf tmp_probe
          grep -q 'defmodule BeamPM.AutonomyKernelGeneratedTest do' generated/elixir/test/beam4pm_ash_test.exs
          git diff --exit-code -- generated/elixir/lib/beam4pm_ash.ex generated/elixir/test/beam4pm_ash_test.exs

      - name: Prove clean exact-head subject
        run: |
          set -euo pipefail
          git diff --exit-code
