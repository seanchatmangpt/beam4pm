name: WS2 temporary canonical regeneration

on:
  push:
    branches:
      - codex/ws2-autonomic-blackboard-50-20260912
    paths:
      - ontology.ttl
      - lib/beam4pm_a2a_agent.ex
      - scripts/igniter_sync.sh
      - .github/workflows/ws2-temporary-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Regenerate exact admitted subject
        shell: bash
        run: |
          set -euo pipefail
          cp ontology.ttl /tmp/root-ontology.ttl
          cp ontology.ttl /tmp/composed-ontology.ttl
          while IFS= read -r fragment; do
            cat "$fragment" >> /tmp/composed-ontology.ttl
          done < <(find ontology -type f -name '*.ttl' -print | LC_ALL=C sort)
          cp /tmp/composed-ontology.ttl ontology.ttl
          mapfile -t targets < <(sed -n '/primary-ggen-targets.txt.*TARGETS/,/^[[:space:]]*TARGETS$/p' .github/workflows/beam4pm-manufacture.yml | sed '1d;$d' | sed 's/^[[:space:]]*//')
          targets+=(
            docs/reference/beam4pm_hand_authored_source.md
            schema/beam4pm_hand_authored_source.tsv
            test/beam4pm_authorship_gate_test.exs
            docs/generated/hand-authored-source-admissions.md
            qualification/generated/hand-authored-source-admissions.tsv
          )
          rm -rf .ggen-v2
          rm -f ggen.lock
          for target in "${targets[@]}"; do rm -rf "$target"; done
          ggen sync run
          cp /tmp/root-ontology.ttl ontology.ttl
          rm -rf .ggen-v2
      - name: Publish generated projection
        shell: bash
        run: |
          set -euo pipefail
          cd /__w/beam4pm/beam4pm
          git config --global --add safe.directory /__w/beam4pm/beam4pm
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ggen): regenerate A2A bootstrap admission projection"
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
