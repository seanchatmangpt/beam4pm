name: WS2 temporary canonical regeneration

on:
  push:
    branches: [codex/ws2-autonomic-blackboard-50-20260912]
    paths: [".github/workflows/ws2-temporary-regenerate.yml"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate from canonical ontology
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ontology.ttl "$RUNNER_TEMP/ontology.ttl.original"
          mapfile -t fragments < <(find ontology -type f -name '*.ttl' -print 2>/dev/null | LC_ALL=C sort)
          for fragment in "${fragments[@]}"; do
            printf '\n\n# ---- composed canonical fragment: %s ----\n' "$fragment" >> ontology.ttl
            cat "$fragment" >> ontology.ttl
          done
          awk '/primary-ggen-targets.txt.*TARGETS/{capture=1; next} capture && /^[[:space:]]*TARGETS$/{exit} capture{sub(/^[[:space:]]{10}/,""); print}' .github/workflows/beam4pm-manufacture.yml > "$RUNNER_TEMP/targets"
          printf '%s\n' docs/reference/beam4pm_hand_authored_source.md schema/beam4pm_hand_authored_source.tsv >> "$RUNNER_TEMP/targets"
          while IFS= read -r path; do
            test -f "$path" && rm -f "$path" || true
          done < "$RUNNER_TEMP/targets"
          rm -f ggen.lock
          ggen sync run
          cp "$RUNNER_TEMP/ontology.ttl.original" ontology.ttl
          rm -rf .ggen-v2
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ALIVE[IDENTICAL_REGENERATION]"
            exit 0
          fi
          git commit -m "chore(ggen): regenerate EDS test admission projection"
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
