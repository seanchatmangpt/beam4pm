name: beam4pm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    name: Erlang/Elixir/Gleam tests + determinism check

    steps:
      - name: Checkout (with vendor/ggen-marketplace submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Set up Erlang/OTP + Elixir + rebar3 + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          gleam-version: '1.18.1'
          rebar3-version: '3.24.0'
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Cache rebar3 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-27.2-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-27.2-3.24.0-
            ${{ runner.os }}-rebar3-27.2-
            ${{ runner.os }}-rebar3-

      - name: rebar3 eunit
        shell: bash
        run: |
          rebar3 eunit

      - name: Build rust4pm-Reactor-validation oracle crates (RF1/RF2/RF3)
        shell: bash
        run: |
          # Real Rust subprocess oracles the RF1/RF2/RF3 Chicago tests spawn (thin
          # adapters over the real process_mining =0.6.2 function surface, no
          # algorithm re-implemented). ubuntu-latest ships a preinstalled
          # cargo/rustc, the same toolchain that already compiles ggen_igniter's
          # native/ggen_graph_nif rustler NIF at `mix test` time.
          cd native/rf1-dfg-oracle && cargo build --release && cd -
          cd native/rf2-conformance-oracle && cargo build --release && cd -
          cd native/rf3-ocel-oracle && cargo build --release && cd -

      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-27.2-1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-27.2-1.18.5-
            ${{ runner.os }}-mix-27.2-
            ${{ runner.os }}-mix-

      - name: mix deps.get
        shell: bash
        run: |
          mix deps.get

      - name: mix test
        shell: bash
        run: |
          source scripts/env/rust4pm_reactor_env.sh
          mix test

      - name: gleam test (gleam/ projection)
        shell: bash
        run: |
          cd gleam
          gleam test

      - name: Cross-language wire identity (Erlang<->Elixir roundtrip)
        shell: bash
        run: |
          bash scripts/roundtrip_check.sh

      - name: Determinism check -- regenerate and diff against committed output
        continue-on-error: true
        shell: bash
        run: |
          # KNOWN GAP (carried from the replaced hand-authored ci.yml, still open):
          # this step needs a real `ggen` binary on the runner and none is installed
          # here yet. It fails loudly ('ggen: command not found') instead of faking a
          # pass; continue-on-error is set only so this one tracked gap does not turn
          # every push/PR red. Remove continue-on-error once a real install step lands.
          bash scripts/gate_m2_check.sh

