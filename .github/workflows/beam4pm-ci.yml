name: beam4pm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    name: Erlang/Elixir/Gleam tests + determinism check

    steps:
      - name: Checkout (with vendor/ggen-marketplace submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Set up Erlang/OTP + Elixir + rebar3 + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          gleam-version: '1.18.1'
          rebar3-version: '3.24.0'
          elixir-version: '1.18.5'
          otp-version: '27.2'
        
      - name: Cache rebar3 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-rebar3-27.2-3.24.0-\n${{ runner.os }}-rebar3-27.2-\n${{ runner.os }}-rebar3-\n"
          key: ${{ runner.os }}-rebar3-27.2-3.24.0-${{ hashFiles('rebar.lock') }}
          path: "_build\n~/.cache/rebar3\n"
        
      - name: rebar3 eunit
        shell: bash
        run: |
          rebar3 eunit

      - name: Build rust4pm-Reactor-validation oracle crates (RF1/RF2/RF3)
        shell: bash
        run: |
          # Real Rust subprocess oracles the RF1/RF2/RF3 Chicago tests spawn (thin
          # adapters over the real process_mining =0.6.2 function surface, no
          # algorithm re-implemented). ubuntu-latest ships a preinstalled
          # cargo/rustc, the same toolchain that already compiles ggen_igniter's
          # native/ggen_graph_nif rustler NIF at `mix test` time.
          cd native/rf1-dfg-oracle && cargo build --release && cd -
          cd native/rf2-conformance-oracle && cargo build --release && cd -
          cd native/rf3-ocel-oracle && cargo build --release && cd -

      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-mix-27.2-1.18.5-\n${{ runner.os }}-mix-27.2-\n${{ runner.os }}-mix-\n"
          key: ${{ runner.os }}-mix-27.2-1.18.5-${{ hashFiles('mix.lock') }}
          path: "deps\n~/.hex\n~/.mix\n"
        
      - name: mix deps.get
        shell: bash
        run: |
          mix deps.get

      - name: mix test
        shell: bash
        run: |
          source scripts/env/rust4pm_reactor_env.sh
          mix test

      - name: gleam test (gleam/ projection)
        shell: bash
        run: |
          cd gleam
          gleam test

      - name: Cross-language wire identity (Erlang<->Elixir roundtrip)
        shell: bash
        run: |
          bash scripts/roundtrip_check.sh

      - name: Determinism check -- regenerate via identity-verified GGen release and diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 \
            -o "$archive" \
            https://github.com/seanchatmangpt/ggen/releases/download/v26.8.28/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo 'ccb9fe78ef0c84d8b240b45beb6e73f47e2c930d5db3efcf9a0e58dfe071d313  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.local/bin" ggen
          chmod +x "$HOME/.local/bin/ggen"
          export PATH="$HOME/.local/bin:$PATH"
          ggen --version
          bash scripts/gate_m2_check.sh

      - name: Preserve deterministic Ash repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          if-no-files-found: error
          path: "**/beam4pm_ash*.ex*"
          name: beam4pm-ash-determinism-${{ github.sha }}
        
