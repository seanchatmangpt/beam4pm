name: beam4pm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    name: Erlang/Elixir/Gleam/Rust4PM tests + determinism check

    steps:
      - name: Checkout exact subject (with vendor/ggen-marketplace submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Prove checked-out subject identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "EXACT_HEAD_ALIVE=$EXPECTED_HEAD"

      - name: Set up Erlang/OTP + Elixir + rebar3 + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          gleam-version: '1.18.1'
          rebar3-version: '3.24.0'
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Cache rebar3 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-rebar3-27.2-3.24.0-\n${{ runner.os }}-rebar3-27.2-\n${{ runner.os }}-rebar3-\n"
          key: ${{ runner.os }}-rebar3-27.2-3.24.0-${{ hashFiles('rebar.lock') }}
          path: "_build\n~/.cache/rebar3\n"

      - name: rebar3 eunit
        shell: bash
        run: rebar3 eunit

      - name: Build native rust4pm oracle crates (RF1/RF2/RF3/RF4)
        shell: bash
        run: |
          set -euo pipefail
          cd native/rf1-dfg-oracle && cargo build --release && cd -
          cd native/rf2-conformance-oracle && cargo build --release && cd -
          cd native/rf3-ocel-oracle && cargo build --release && cd -
          cd native/rf4-oc-discovery-oracle && cargo build --release && cd -

      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-mix-27.2-1.18.5-\n${{ runner.os }}-mix-27.2-\n${{ runner.os }}-mix-\n"
          key: ${{ runner.os }}-mix-27.2-1.18.5-${{ hashFiles('mix.lock') }}
          path: "deps\n~/.hex\n~/.mix\n"

      - name: mix deps.get
        shell: bash
        run: mix deps.get

      - name: mix test
        shell: bash
        run: |
          source scripts/env/rust4pm_reactor_env.sh
          mix test

      - name: gleam test (gleam/ projection)
        shell: bash
        run: |
          cd gleam
          gleam test

      - name: Cross-language wire identity (Erlang<->Elixir roundtrip)
        shell: bash
        run: bash scripts/roundtrip_check.sh

      - name: Determinism check -- regenerate via ggen-ecosystem container and diff against committed output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28 ggen "$@"' \
            > "$HOME/.local/bin/ggen"
          chmod +x "$HOME/.local/bin/ggen"
          export PATH="$HOME/.local/bin:$PATH"
          ggen --version
          bash scripts/gate_m2_check.sh

      # Build the WASM engine only after GATE M2. Several generator syncs run
      # `mix test` internally; keeping the machine-local canonical-scale T1
      # corpus out of that manufacturing phase preserves its named absence
      # semantics while the portable WASM qualification below still executes.
      - name: Build Rust4PM WASM engine (wasm32-wasip1)
        shell: bash
        run: bash scripts/rust4pm_wasm_build.sh

      - name: Portable Rust4PM WASM + RF4 qualification
        shell: bash
        run: mix test test/beam4pm_rust4pm_ci_test.exs
