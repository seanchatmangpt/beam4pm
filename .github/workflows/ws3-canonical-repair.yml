name: WS3 Canonical Projection Repair

on:
  push:
    branches:
      - automation/ws3-actuation-20260907-0635
    paths:
      - .github/workflows/ws3-canonical-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch with canonical pack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: automation/ws3-actuation-20260907-0635
          submodules: recursive
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Manufacture exact Ash projection
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/igniter_sync.sh

      - name: Fence generated surface and publish repair
        shell: bash
        run: |
          set -euo pipefail
          git add lib/beam4pm_ash_domain.ex lib/beam4pm_ash/resources test/beam4pm_ash/resources

          mapfile -t generated < <(git diff --cached --name-only)
          test "${#generated[@]}" -eq 101
          for file in "${generated[@]}"; do
            head -3 "$file" | grep -qi 'GENERATED by ggen_igniter'
          done

          # This workflow is transport, not architecture. Remove it in the same
          # repair commit so the branch retains only canonical projections.
          git rm .github/workflows/ws3-canonical-repair.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ws3): sync canonical Ash projections'
          git push origin HEAD:automation/ws3-actuation-20260907-0635
