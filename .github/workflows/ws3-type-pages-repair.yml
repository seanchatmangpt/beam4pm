name: WS3 type-page deterministic regeneration repair

on:
  push:
    branches:
      - automation/ws3-rev-20260831-runtime-value-50

permissions:
  contents: write

jobs:
  persist-exact-manufactured-type-pages:
    if: "!contains(github.event.head_commit.message, 'fix(type-pages): persist exact WS3 deterministic regeneration')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact WS3 branch with manufacturer submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          submodules: recursive

      - name: Set up authoritative BEAM manufacturer runtime
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Restore manufacturer dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-mix-27.2-1.18.5-\n${{ runner.os }}-mix-27.2-\n${{ runner.os }}-mix-\n"
          key: ${{ runner.os }}-mix-27.2-1.18.5-${{ hashFiles('mix.lock') }}
          path: "deps\n~/.hex\n~/.mix\n"

      - name: Manufacture and persist only missing WS3 type pages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pro_type_pages_sync.sh

          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          if [ "${#changed[@]}" -ne 50 ]; then
            echo "REFUSED: expected exactly 50 manufactured WS3 type pages, observed ${#changed[@]}" >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              docs/reference/types/*.md) ;;
              *) echo "REFUSED: manufacturer changed out-of-scope path: $path" >&2; exit 1 ;;
            esac
            grep -q 'GENERATED by ggen' "$path"
          done

          total="$(find docs/reference/types -maxdepth 1 -type f -name '*.md' | wc -l)"
          [ "$total" -eq 285 ] || {
            echo "REFUSED: expected 285 deterministic type pages, observed $total" >&2
            exit 1
          }

          git diff --check
          git config user.name 'beam4pm manufacturing repair'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add -- docs/reference/types
          git commit -m 'fix(type-pages): persist exact WS3 deterministic regeneration'
          git push origin HEAD:automation/ws3-rev-20260831-runtime-value-50
