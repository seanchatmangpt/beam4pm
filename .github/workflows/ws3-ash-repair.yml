name: WS3 Ash deterministic regeneration repair

on:
  push:
    branches:
      - automation/ws3-rev-20260831-runtime-value-50

permissions:
  actions: read
  contents: write

jobs:
  persist-exact-manufactured-ash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact WS3 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Verify artifact identity, persist exact manufactured bytes, and push repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: '9781691695'
          SOURCE_RUN_ID: '33456057068'
          SOURCE_HEAD_SHA: '00f05d96febdc70ccdc4590ab526097563d00fda'
          ARTIFACT_DIGEST: 'sha256:2f39a8769bf50c5534082cdeee84ececc77c30542f229e93c7d64776895307b6'
        shell: bash
        run: |
          set -euo pipefail
          repair="$RUNNER_TEMP/ws3-ash-repair"
          mkdir -p "$repair"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID" \
            -o "$RUNNER_TEMP/artifact.json"

          python - "$RUNNER_TEMP/artifact.json" <<'PY'
          import json, os, sys
          meta = json.load(open(sys.argv[1]))
          assert str(meta['id']) == os.environ['ARTIFACT_ID'], meta
          assert str(meta['workflow_run']['id']) == os.environ['SOURCE_RUN_ID'], meta
          assert meta['workflow_run']['head_sha'] == os.environ['SOURCE_HEAD_SHA'], meta
          assert meta['digest'] == os.environ['ARTIFACT_DIGEST'], meta
          print('ARTIFACT_IDENTITY_OK')
          PY

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/ws3-ash-repair.zip"
          unzip -q "$RUNNER_TEMP/ws3-ash-repair.zip" -d "$repair"

          echo '69fda453b3b1d06d6598fc26a81586efdc86cd714b887a0d12889f61c62401a1  '"$repair/lib/beam4pm_ash.ex" | sha256sum --check --strict
          echo '0bd31a35a560b250017fd0db0ba5bd5f14cbb14e73fb785b067e0931add6c997  '"$repair/test/beam4pm_ash_test.exs" | sha256sum --check --strict

          cp "$repair/lib/beam4pm_ash.ex" lib/beam4pm_ash.ex
          cp "$repair/test/beam4pm_ash_test.exs" test/beam4pm_ash_test.exs

          mapfile -t changed < <(git diff --name-only | sort)
          expected=$'lib/beam4pm_ash.ex\ntest/beam4pm_ash_test.exs'
          actual="$(printf '%s\n' "${changed[@]}")"
          if [ "$actual" != "$expected" ]; then
            echo 'REFUSED: exact artifact application changed a path outside the two court-captured projections' >&2
            git status --short
            exit 1
          fi

          git diff --check
          git config user.name 'beam4pm manufacturing repair'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add -- lib/beam4pm_ash.ex test/beam4pm_ash_test.exs
          git commit -m 'fix(ash): persist exact WS3 deterministic regeneration'
          git push origin HEAD:automation/ws3-rev-20260831-runtime-value-50
