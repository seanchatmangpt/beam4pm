# Independent qualification rail; NOT a ggen-generated projection.
# Preserves the DfCM Chicago court outside manufactured test/ ownership.
name: WS2 DfCM Independent Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "qualification/beam4pm_dfcm_test.exs"
      - "qualification/fixtures/dfcm/**"
      - "lib/beam4pm_dfcm.ex"
      - "ontology.ttl"
      - "ontology/ws2-autonomic-planning/**"
      - ".github/workflows/ws2-dfcm-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dfcm:
    name: DfCM SELECT-only Chicago
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3.1"
      - name: Resolve dependencies
        shell: bash
        run: mix deps.get
      - name: Execute preserved DfCM Chicago qualification
        shell: bash
        run: mix test qualification/beam4pm_dfcm_test.exs
