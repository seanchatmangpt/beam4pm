name: beam4pm Infra Validate (Terraform + Packer, validate-only)
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "ontology.ttl"
      - "vendor/ggen-marketplace/packs/beam4pm-pro-infra-pack/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "ontology.ttl"
      - "vendor/ggen-marketplace/packs/beam4pm-pro-infra-pack/**"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Terraform + Packer validate (no apply, no build, zero cloud credentials)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
        
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
        
      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 'latest'
        
      - name: terraform init -backend=false + terraform validate (all infra/ Terraform modules)
        shell: bash
        run: |
          set -euo pipefail
          for d in infra/gcp/cloudrun infra/terraform/github; do
            if [ ! -d "$d" ]; then
              echo "== skip (not present yet): $d =="
              continue
            fi
            echo "== terraform init/validate: $d =="
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

      - name: packer init + packer validate (infra/gcp/packer)
        shell: bash
        run: |
          set -euo pipefail
          packer init infra/gcp/packer
          packer validate infra/gcp/packer

