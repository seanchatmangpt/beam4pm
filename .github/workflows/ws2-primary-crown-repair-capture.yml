name: WS2 primary crown repair capture

on:
  push:
    branches:
      - codex/ws2-autonomic-blackboard-50-20260912

permissions:
  contents: write

concurrency:
  group: ws2-primary-crown-repair-capture
  cancel-in-progress: false

jobs:
  manufacture-publish:
    if: "!contains(github.event.head_commit.message, 'fix(crown): manufacture acceptance admissions')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28
    steps:
      - name: Checkout exact repair subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/ws2-autonomic-blackboard-50-20260912
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Manufacture and publish primary projections
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'beam4pm primary manufacturer'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'

          root_backup="$(mktemp)"
          cp ontology.ttl "$root_backup"
          mapfile -t fragments < <(find ontology -type f -name '*.ttl' -print 2>/dev/null | LC_ALL=C sort)
          for fragment in "${fragments[@]}"; do
            printf '\n\n# ---- composed canonical fragment: %s ----\n' "$fragment" >> ontology.ttl
            cat "$fragment" >> ontology.ttl
          done

          rm -f ggen.lock
          ggen sync run
          cp "$root_backup" ontology.ttl
          rm -f "$root_backup"
          rm -rf .ggen-v2

          allowed_workflow='.github/workflows/ws2-primary-crown-repair-capture.yml'
          bad=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ "$path" = "$allowed_workflow" ] || [ "$path" = "ggen.lock" ]; then
              continue
            fi
            if [ ! -f "$path" ] || ! head -3 "$path" 2>/dev/null | grep -qi 'GENERATED by ggen'; then
              echo "REFUSED[NON_PRIMARY_GENERATED_DRIFT]:$path" >&2
              bad=1
            fi
          done < <(git status --porcelain=v1 | sed -E 's/^.. //; s/.* -> //')
          [ "$bad" -eq 0 ] || exit 2

          git add -A
          git rm "$allowed_workflow"
          git commit -m 'fix(crown): manufacture acceptance admissions'
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
