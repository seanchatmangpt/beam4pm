name: beam4pm Container PR Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - rebar.config
      - mix.exs
      - mix.lock
      - "src/**"
      - "lib/**"
      - "test/**"
      - "native/**"
      - "qualification/**"
      - "scripts/env/**"
      - scripts/rust4pm_wasm_build.sh
      - ".github/workflows/beam4pm-container-pr.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build full linux/amd64 image without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head with submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Prove exact subject identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "EXACT_HEAD_ALIVE=$EXPECTED_HEAD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without registry write authority
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
          cache-from: type=gha,scope=beam4pm-pr-amd64
          cache-to: type=gha,mode=max,scope=beam4pm-pr-amd64
