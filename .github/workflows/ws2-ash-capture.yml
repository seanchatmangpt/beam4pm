name: WS2 Ash Projection Capture
on:
  push:
    branches: [automation/ws2-rev-commercial-contracts-20260830-1609]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ws2-ash-capture-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Set up production BEAM toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: '1.18.5'
          otp-version: '27.2'
      - name: Manufacture exact Ash projections
        shell: bash
        run: |
          set -euo pipefail
          rm -f lib/beam4pm_ash.ex test/beam4pm_ash_test.exs
          bash scripts/igniter_sync.sh
          sha256sum lib/beam4pm_ash.ex test/beam4pm_ash_test.exs
      - name: Preserve manufactured projections
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ws2-ash-projections-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lib/beam4pm_ash.ex
            test/beam4pm_ash_test.exs
          if-no-files-found: error
