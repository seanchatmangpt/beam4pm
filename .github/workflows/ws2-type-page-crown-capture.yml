name: WS2 type-page crown capture

on:
  push:
    branches:
      - codex/ws2-autonomic-blackboard-50-20260912

permissions:
  contents: write

concurrency:
  group: ws2-type-page-crown-capture
  cancel-in-progress: true

jobs:
  manufacture-publish:
    if: "!contains(github.event.head_commit.message, 'fix(crown): capture WS2 type projections')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact crown with pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/ws2-autonomic-blackboard-50-20260912
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set up BEAM manufacturing toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          rebar3-version: '3.24.0'
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Manufacture and publish WS2 type projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'beam4pm type-page manufacturer'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          bash scripts/pro_type_pages_sync.sh

          bad=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              docs/reference/types/*.md|.github/workflows/ws2-type-page-crown-capture.yml) ;;
              *) echo "REFUSED[NON_TYPE_PAGE_DRIFT]:$path" >&2; bad=1 ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //; s/.* -> //')
          [ "$bad" -eq 0 ] || exit 2

          git add docs/reference/types
          git rm .github/workflows/ws2-type-page-crown-capture.yml
          git diff --cached --check
          git commit -m 'fix(crown): capture WS2 type projections'
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
