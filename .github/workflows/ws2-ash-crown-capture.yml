name: WS2 Ash crown capture

on:
  push:
    branches:
      - codex/ws2-autonomic-blackboard-50-20260912

permissions:
  contents: write

concurrency:
  group: ws2-ash-crown-capture
  cancel-in-progress: false

jobs:
  manufacture-publish:
    if: "!contains(github.event.head_commit.message, 'fix(crown): regenerate combined Ash and type docs')"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact crown with pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/ws2-autonomic-blackboard-50-20260912
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set up BEAM manufacturing toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          rebar3-version: '3.24.0'
          elixir-version: '1.18.5'
          otp-version: '27.2'

      - name: Manufacture complete Ash projection set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'beam4pm Ash manufacturer'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          mix deps.get
          for crate in rf1-dfg-oracle rf2-conformance-oracle rf3-ocel-oracle rf4-oc-discovery-oracle; do
            (cd "native/$crate" && cargo build --release)
          done

          verify=/tmp/ws2-igniter-verify
          mix new "$verify" --app ws2_igniter_verify --module Ws2IgniterVerify
          pack=vendor/ggen-marketplace/packs/beam4pm-process-model-pack
          ign="$pack/igniter"
          merged=tmp_probe/ontology_merged.ttl
          mkdir -p tmp_probe
          cat ontology.ttl "$pack/ontology.ttl" vendor/ggen-marketplace/packs/frontier-release-beam-pack/ontology.ttl > "$merged"

          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --query ash_fields="$ign/queries/ash_fields.rq" --for-each records --on-stale prune --template "$ign/templates/beam4pm_ash_resource.ex.eex" --out 'lib/beam4pm_ash/resources/<%= record_name %>.ex' --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --template "$ign/templates/beam4pm_ash_domain.ex.eex" --out lib/beam4pm_ash_domain.ex --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --query ash_fields="$ign/queries/ash_fields.rq" --template "$ign/templates/beam4pm_ash_roundtrip.ex.eex" --out lib/beam4pm_ash_roundtrip.ex --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --query fields="$ign/queries/fields.rq" --template "$ign/templates/beam4pm_ash_resource_test.exs.eex" --out test/beam4pm_ash_resources_test.exs --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --query ash_fields="$ign/queries/ash_fields.rq" --template "$ign/templates/beam4pm_ash_roundtrip_test.exs.eex" --out test/beam4pm_ash_roundtrip_test.exs --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --template "$ign/templates/beam4pm_ash_kernel_test.exs.eex" --out test/beam4pm_ash_kernel_test.exs --verify-cwd "$verify"
          mix ggen_igniter.sync --ontology "$merged" --query records="$ign/queries/records.rq" --query fields="$ign/queries/fields.rq" --template "$ign/templates/beam4pm_types_manifest.ex.eex" --out tmp_probe/beam4pm_types_manifest.ex --verify-cwd "$verify"
          diff -u lib/beam4pm_types_manifest.ex tmp_probe/beam4pm_types_manifest.ex

          source scripts/env/rust4pm_reactor_env.sh
          bash scripts/igniter_sync.sh

          allowed='^(lib/beam4pm_ash_domain\.ex|lib/beam4pm_ash_roundtrip\.ex|lib/beam4pm_ash/resources/.*\.ex|test/beam4pm_ash_resources_test\.exs|test/beam4pm_ash_roundtrip_test\.exs|test/beam4pm_ash_kernel_test\.exs|\.github/workflows/ws2-ash-crown-capture\.yml)$'
          bad=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! printf '%s\n' "$path" | grep -Eq "$allowed"; then
              echo "REFUSED[NON_ASH_GENERATED_DRIFT]:$path" >&2
              bad=1
            fi
          done < <(git status --porcelain=v1 | sed -E 's/^.. //; s/.* -> //')
          [ "$bad" -eq 0 ] || exit 2

          git add docs/reference/types lib/beam4pm_ash_domain.ex lib/beam4pm_ash_roundtrip.ex lib/beam4pm_ash/resources test/beam4pm_ash_resources_test.exs test/beam4pm_ash_roundtrip_test.exs test/beam4pm_ash_kernel_test.exs
          git rm .github/workflows/ws2-ash-crown-capture.yml
          git diff --cached --check -- . ':(exclude)lib/beam4pm_ash/resources/*.ex'
          git commit -m 'fix(crown): regenerate combined Ash and type docs'
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
