name: WS2 DfCM scheduled recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ws2_dfcm_recovery_check.sh'
      - '.github/workflows/ws2-dfcm-recovery.yml'
      - '.github/workflows/ws2-dfcm-crown-integration.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact already-manufactured beam4pm subject to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ws2-dfcm-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-subject-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECOVERY_SUBJECT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.subject_sha || '574368706e6afd804c7a13771bed3cf03da33ce0' }}

    steps:
      - name: Checkout recovery court
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve court outside target checkout
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ws2_dfcm_recovery_check.sh "$RUNNER_TEMP/ws2_dfcm_recovery_check.sh"
          chmod +x "$RUNNER_TEMP/ws2_dfcm_recovery_check.sh"
          bash -n "$RUNNER_TEMP/ws2_dfcm_recovery_check.sh"

      - name: Checkout exact admitted subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git rev-parse --verify "${RECOVERY_SUBJECT_SHA}^{commit}"
          git checkout --detach "$RECOVERY_SUBJECT_SHA"
          test "$(git rev-parse HEAD)" = "$RECOVERY_SUBJECT_SHA"
          git submodule update --init --recursive

      - name: Set up admitted BEAM toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          rebar3-version: '3.24.0'
          elixir-version: '1.18.4'
          otp-version: '27.2.4'

      - name: Record toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          echo 'WS2_DFCM_TOOLCHAIN=otp=27.2.4;elixir=1.18.4;rebar3=3.24.0' >> "$GITHUB_ENV"

      - name: Prepare deterministic regeneration dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix deps.get
          for crate in rf1-dfg-oracle rf2-conformance-oracle rf3-ocel-oracle rf4-oc-discovery-oracle; do
            (cd "native/$crate" && cargo build --release)
          done

      - name: Bind ggen-ecosystem validation capsule
        shell: bash
        run: |
          set -euo pipefail
          capsule='ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28'
          docker pull "$capsule"
          capsule_image_id="$(docker image inspect --format '{{.Id}}' "$capsule")"
          capsule_repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$capsule")"

          echo "WS2_DFCM_CAPSULE=$capsule" >> "$GITHUB_ENV"
          echo "WS2_DFCM_CAPSULE_IMAGE_ID=$capsule_image_id" >> "$GITHUB_ENV"
          echo "WS2_DFCM_CAPSULE_REPO_DIGEST=$capsule_repo_digest" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.local/bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace ghcr.io/seanchatmangpt/ggen-ecosystem:v26.8.28 ggen "$@"' \
            > "$HOME/.local/bin/ggen"
          chmod +x "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Execute read-only DfCM recovery court
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          "$RUNNER_TEMP/ws2_dfcm_recovery_check.sh" "$RECOVERY_SUBJECT_SHA" "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ws2-dfcm-recovery-receipt.json"

      - name: Preserve recovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ws2-dfcm-recovery-${{ env.RECOVERY_SUBJECT_SHA }}
          path: ${{ runner.temp }}/ws2-dfcm-recovery-receipt.json
          if-no-files-found: warn
          retention-days: 14
