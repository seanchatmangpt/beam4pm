name: WS2 temporary ontology transport repair

on:
  push:
    branches:
      - codex/ws2-autonomic-blackboard-50-20260912
    paths:
      - .github/workflows/ws2-temporary-repair-ontology.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore exact parent blob and bind admitted digest
        shell: bash
        run: |
          set -euo pipefail
          git show 32e23906ed72d2f4ab365e7006c6e1c9ca42409e:ontology.ttl > ontology.ttl
          sed -i 's/5e25c4bebaf20f255dfb36ebd88ba7beec2ecf181fce1f32f346d7af5dab1abd/fb92b63e147a63841feaee1d8d212930ab180e24170255811078eac66908f9f6/' ontology.ttl
          test "$(grep -c 'fb92b63e147a63841feaee1d8d212930ab180e24170255811078eac66908f9f6' ontology.ttl)" -eq 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ontology.ttl
          git commit -m "fix(ontology): restore exact transport and admit A2A bootstrap"
          git push origin HEAD:codex/ws2-autonomic-blackboard-50-20260912
