# Google Cloud Marketplace Display Metadata for beam4pm_pro
# Defines how the product would be displayed in Google Cloud Marketplace.
#
# STATUS: locally-manufactured substrate. Never submitted; no seller account
# (MP0 BLOCKED), no listing review (MP1 BLOCKED), no billing integration
# (MP6 BLOCKED). All URLs/contacts are placeholders except the public GitHub
# product repository. Per beam4pm docs/jira/v26.8.29/05-pricing-packaging-
# unit-economics.md, actual dollar levels remain UNKNOWN until buyer
# discovery - no price constants appear in this file by design.

title: "beam4pm_pro: BEAM-Native Process Intelligence Platform"
shortDescription: "Governed process mining and process intelligence, manufactured from an RDF ontology by ggen, for BEAM and cloud-native estates"
longDescription: |
  beam4pm_pro is the commercial layer of beam4pm, a BEAM-first
  process-mining substrate whose application source is manufactured entirely
  by ggen from an RDF ontology and a vendored ggen-marketplace pack.

  ## Key Features
  - **Process discovery**: traces, directly-follows graphs, process variants
    from real event data (OCEL event/object model, 31 admitted record types)
  - **Conformance**: fitness checking of observed traces against discovered
    models
  - **Four projections**: Erlang, Elixir, Gleam, and Ash from one canonical
    ontology, with proven Erlang <-> Elixir cross-language wire identity
  - **Manufactured, not hand-written**: every generated artifact is
    reproducible from the ontology; a deterministic reprojection gate is part
    of the release discipline
  - **Customer-boundary data**: telemetry and process evidence stay inside
    the customer boundary by default

  ## Capability Ladder
  Entitlement tiers follow a monotonic capability ladder (policy-expressed,
  never a marketplace-specific feature fork):
  - **Observe** - zero/low-config discovery, service graph, process
    candidates, baseline process metrics, local UI/API
  - **Infer** - Observe plus continuous process inference, variants,
    OCEL/event-object reconstruction, confidence/provenance, anomaly and
    repeated-loop detection
  - **Govern** - Infer plus conformance, formal projections, planning,
    policy/admission integration, enterprise fleet controls, advanced
    audit/receipt retention
  - **Sovereign** - Govern plus air-gapped operation, signed offline
    bundles, customer-managed keys, offline entitlement reconciliation

  ## Deployment Options
  - **Cloud Run**: serverless container deployment (terraform, stream I1)
  - **Compute Engine**: packer-built VM image (terraform + packer, stream I2)

version: "26.8.29"
minimumVersion: "26.8.29"

# Required APIs that need to be enabled in the buyer project
requiredApis:
  - compute.googleapis.com
  - run.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com
  - iam.googleapis.com
  - artifactregistry.googleapis.com

# ============================================================================
# Pricing - usage-based placeholder dimensions only.
#
# Dimension identities come from beam4pm
# docs/jira/v26.8.29/05-pricing-packaging-unit-economics.md ("Commercial
# dimensions to experiment with"). Per DfCM, multiple lawful pricing models
# are preserved until customer and marketplace evidence selects a best fit.
# Dollar levels are deliberately absent: doc 05 states actual dollar levels
# remain UNKNOWN until buyer discovery and willingness-to-pay evidence exist.
# ============================================================================
pricing:
  status: PLACEHOLDER_DIMENSIONS_ONLY
  priceLevels: UNKNOWN   # per doc 05 - never turn a price guess into doctrine
  billingIntegration: BLOCKED   # MP6 - requires seller account + Cloud Commerce
  capabilityTiers:
    - id: observe
      name: Observe
      description: Discovery, service/process graph, baseline metrics
    - id: infer
      name: Infer
      description: Continuous process inference, variants, OCEL reconstruction
    - id: govern
      name: Govern
      description: Conformance, formal projections, planning, policy controls
    - id: sovereign
      name: Sovereign
      description: Air-gap/offline/fleet/security/support premium tier
  usageDimensionCandidates:
    - id: estate-band
      model: "Model A - estate bands"
      unit: governed environment/cluster/service-estate band
    - id: process-scope
      model: "Model B - process scope"
      unit: discovered/governed process-estate band
    - id: capacity-unit
      model: "Model C - capacity units"
      unit: marketplace-compatible capacity unit
    - id: commitment-overage
      model: "Model D - platform commitment + overage"
      unit: annual/multi-year commitment with metered expansion
  segmentation:
    - departmental/land - bounded estate, one use case, standard support
    - enterprise - multi-environment, richer inference/governance, private offer
    - sovereign - disconnected/regulated deployment, premium support
  googleCompatibility: >-
    Support subscription, usage or hybrid private-offer structures where
    product form permits; preserve entitlement/order identity for
    multiple-order scenarios (ENTITLEMENT_ID is the commercial identity).

